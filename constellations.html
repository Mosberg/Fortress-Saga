<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constellations | Fortress Saga Hub</title>
  <meta name="description" content="Fortress Saga constellation planner: nebula effects, class unlocks and Stardust costs.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <h1 class="page-title">Constellations</h1>
    <p class="page-lead">Set the level you plan for each nebula. The planner counts levels toward class unlocks and adds up Stardust where the cost per level is known; for the rest, type the cost you see in game. Your plan is saved in this browser.</p>
    <section class="grid-2">
      <div class="card"><h2>How constellations work</h2><div id="mechanics"></div></div>
      <div class="card">
        <h2>Your plan</h2>
        <div class="field"><label for="budget">Stardust you have</label><input type="number" id="budget" min="0"></div>
        <div id="summary"></div>
        <button class="btn danger" id="reset" type="button">Reset levels</button>
      </div>
    </section>
    <section class="grid-2" id="planner"></section>
    <section class="card"><h2>Other nebulae</h2><div id="other-nebulae"></div></section>
  </main>
  <footer id="site-footer"></footer>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/pages/constellations.js"></script>
</body>
</html>
